name: DHIQAR TV APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DHIQAR TV APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find DHIQAR TV ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for DHIQAR TV ZIP..."

          ZIP_FILE=""

          if [ -f "DHIQAR-TV-V5-PRO-FULL.zip" ]; then
            ZIP_FILE="DHIQAR-TV-V5-PRO-FULL.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "*DHIQAR*TV*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: DHIQAR TV ZIP not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf dhiqar-project
          mkdir -p dhiqar-project

          unzip -o "$ZIP_FILE" -d dhiqar-project

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find dhiqar-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Extracted files:"
            find dhiqar-project -maxdepth 6 -type f -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo " DHIQAR TV PROJECT"
          echo "======================================"

          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using Gradle 8.9."
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " BUILDING DHIQAR TV"
          echo " Gradle: 8.9"
          echo " Java: 17"
          echo "======================================"

          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/DHIQAR-TV-V5-PRO.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh release/DHIQAR-TV-V5-PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHIQAR-TV-V5-PRO
          path: release/DHIQAR-TV-V5-PRO.apk
          if-no-files-found: error

      - name: Build Complete
        run: |
          echo "======================================"
          echo " DHIQAR TV BUILD SUCCESSFUL"
          echo "======================================"
