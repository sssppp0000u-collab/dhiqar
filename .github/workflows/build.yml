name: Auto Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build Project
      run: |
        echo "البحث عن الملف المضغوط وفك ضغطه..."
        for z in *.zip; do
          if [ -f "$z" ]; then
            unzip -o "$z" || true
          fi
        done
        
        echo "البحث عن ملف البناء (gradlew)..."
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ لم يتم العثور على ملف gradlew! تأكد من أن ملفات المشروع مرفوعة بشكل صحيح."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "📂 تم العثور على المشروع في: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: DHIQAR-TV-APP
        path: "**/build/outputs/apk/debug/*.apk"
