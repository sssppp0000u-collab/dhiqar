name: Build Android APK (Sat-View Hacker Ultra Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract Project ZIP
      run: |
        unzip -o DHIQAR-TV-V4-PRO.zip
        if [ -d "DHIQAR-TV-V4-PRO" ]; then
          cp -rn DHIQAR-TV-V4-PRO/* . || true
        fi

    - name: Apply Ultra Cyber SAT-VIEW Enhancements & Features
      run: |
        python3 -c "
        import glob, re, os

        PIN_CODE = '2027'
        SERVER_URL = 'http://vod4k.cc:80'
        USERNAME = '2142771292105495'
        PASSWORD = '2142771292105495'

        # 1. Inject Auto Login with Sound Effect & PIN 2027
        source_files = glob.glob('**/*.java', recursive=True) + glob.glob('**/*.kt', recursive=True)
        for path in source_files:
            if 'build/' in path: continue
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                code = f.read()

            # PIN Auto Replace
            if 'getText()' in code or 'toString()' in code:
                new_code = re.sub(
                    r'(String\s+([a-zA-Z0-9_]+)\s*=\s*[^;]*getText\(\)\.toString\(\)[^;]*;)',
                    rf'\1\n        if (\2 != null && (\2.trim().equals(\"{PIN_CODE}\") || \2.trim().contains(\"{PIN_CODE}\"))) {{ \2 = \"{SERVER_URL}\"; android.media.ToneGenerator tg = new android.media.ToneGenerator(android.media.AudioManager.STREAM_MUSIC, 100); tg.startTone(android.media.ToneGenerator.TONE_PROP_BEEP2, 150); }}',
                    code
                )
                if new_code != code:
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(new_code)

        # 2. Inject Fast-Zapping Buffering & Fullscreen Mode to ExoPlayer
        for path in source_files:
            if 'build/' in path: continue
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                pcode = f.read()
            if 'ExoPlayer' in pcode or 'PlayerView' in pcode:
                if 'RESIZE_MODE_FILL' not in pcode:
                    pcode = pcode.replace(
                        'playerView.setPlayer',
                        'playerView.setResizeMode(com.google.android.exoplayer2.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL);\n        playerView.setPlayer'
                    )
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(pcode)

        # 3. Inject Cyberpunk Colors (OLED Black, Hacker Green, Cyber Cyan)
        colors_paths = glob.glob('**/res/values/colors.xml', recursive=True)
        cyber_colors = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
        <resources>
            <color name=\"colorPrimary\">#00F0FF</color>
            <color name=\"colorPrimaryDark\">#08090C</color>
            <color name=\"colorAccent\">#00FF66</color>
            <color name=\"backgroundColor\">#050608</color>
            <color name=\"cardBg\">#0E1118</color>
            <color name=\"textColorPrimary\">#FFFFFF</color>
            <color name=\"textColorSecondary\">#00FF66</color>
        </resources>
        '''
        for cpath in colors_paths:
            with open(cpath, 'w', encoding='utf-8') as f:
                f.write(cyber_colors)

        # 4. Enforce Landscape Orientation and Full RTL Support
        manifests = glob.glob('**/AndroidManifest.xml', recursive=True)
        for mpath in manifests:
            with open(mpath, 'r', encoding='utf-8') as f:
                mcontent = f.read()
            if 'supportsRtl' not in mcontent:
                mcontent = mcontent.replace('<application', '<application android:supportsRtl=\"true\"', 1)
            if 'screenOrientation' not in mcontent:
                mcontent = mcontent.replace('<activity', '<activity android:screenOrientation=\"sensorLandscape\" android:configChanges=\"orientation|keyboardHidden|screenSize\"', 1)
            with open(mpath, 'w', encoding='utf-8') as f:
                f.write(mcontent)

        # 5. Fix Image Aspect Ratio and Logo Scaling
        layouts = glob.glob('**/res/layout/*.xml', recursive=True)
        for path in layouts:
            with open(path, 'r', encoding='utf-8') as f:
                lcontent = f.read()
            if '<ImageView' in lcontent:
                lcontent = re.sub(
                    r'(<ImageView[^>]*?)(/?>)',
                    lambda m: m.group(1) + (' android:adjustViewBounds=\"true\" android:scaleType=\"fitCenter\"' if 'scaleType' not in m.group(1) else '') + m.group(2),
                    lcontent
                )
                with open(path, 'w', encoding='utf-8') as f:
                    f.write(lcontent)
        "

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DHIQAR-TV-v4-SAT-ULTRA
        path: "**/build/outputs/apk/debug/*.apk"
