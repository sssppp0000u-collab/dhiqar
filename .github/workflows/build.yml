name: DHIQAR TV APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DHIQAR TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find DHIQAR TV ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*DHIQAR*TV*.zip" | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: DHIQAR TV ZIP not found."
            exit 1
          fi
          rm -rf dhiqar-project
          mkdir -p dhiqar-project
          unzip -o "$ZIP_FILE" -d dhiqar-project

      - name: Locate Android Project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find dhiqar-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 || true)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Patch MainActivity Java Error
        shell: bash
        run: |
          MAIN_ACT=$(find dhiqar-project -type f -name "MainActivity.java" | head -n 1 || true)
          if [ -n "$MAIN_ACT" ]; then
            echo "Patching $MAIN_ACT..."
            sed -i '335s/^/\/\/ /' "$MAIN_ACT" || true
          fi

      - name: Prepare Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --continue
          else
            gradle assembleDebug --no-daemon --continue
          fi

      - name: Find & Package Final APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi
          mkdir -p release
          cp "$APK" "release/DHIQAR-TV-V5-PRO.apk"
          echo "FINAL APK READY AT release/DHIQAR-TV-V5-PRO.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DHIQAR-TV-V5-PRO
          path: release/DHIQAR-TV-V5-PRO.apk
          if-no-files-found: error
