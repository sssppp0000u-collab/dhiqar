name: DHIQAR TV Build Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Directly
        run: |
          mkdir -p dhiqar_build
          # هنا عطيناه اسم الملف مباشرة بدون بحث
          unzip -o DHIQAR-TV-V5-PRO-FULL.zip -d dhiqar_build
          PROJECT_DIR=$(dirname $(find dhiqar_build -name "settings.gradle" | head -n 1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix Line 335 in MainActivity
        run: |
          MAIN_ACT=$(find ${{ env.PROJECT_DIR }} -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            sed -i '335s/.*/\/* & *\//' "$MAIN_ACT"
          fi

      - name: Make Gradle Executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: DHIQAR-TV-READY
          path: ${{ env.PROJECT_DIR }}/**/*.apk
