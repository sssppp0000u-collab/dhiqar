name: Universal Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip & Prepare Project Files
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        for f in *.zip; do
          [ -e "$f" ] || continue
          unzip -o "$f" -d extracted_app || true
        done
        if [ -d "extracted_app" ]; then
          cp -rn extracted_app/*/. . 2>/dev/null || cp -rn extracted_app/* . 2>/dev/null || true
        fi

    - name: Apply Cyber Theme & Layout Customizations
        # ... (جميع أكواد البايثون لتعديل الألوان والخطوط والكبر والأفقية)

    - name: Execute Build (Fail-safe Mode)
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        
        GRADLE_BIN=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLE_BIN" ]; then
          DIR=$(dirname "$GRADLE_BIN")
          echo "Building using local gradlew in $DIR"
          cd "$DIR"
          ./gradlew assembleDebug --no-daemon
        else
          echo "Local gradlew not found, using system Gradle..."
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DHIQAR-TV-CYBER-FINAL
        path: "**/build/outputs/apk/debug/*.apk"
