name: Build DHIQAR TV

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: DHIQAR TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract DHIQAR TV Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*DHIQAR*TV*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: DHIQAR TV ZIP not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf dhiqar_project
          mkdir -p dhiqar_project

          unzip -o "$ZIP_FILE" -d dhiqar_project

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find dhiqar_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find dhiqar_project -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo " DHIQAR TV BUILD"
          echo " Gradle 8.9"
          echo " Java 17"
          echo "================================"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/DHIQAR-TV-V5-PRO.apk

          echo "APK CREATED:"
          ls -lh release/DHIQAR-TV-V5-PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHIQAR-TV-V5-PRO
          path: release/DHIQAR-TV-V5-PRO.apk
          if-no-files-found: error
